<title>ระบบหลังร้าน สยามเซอร์วิส</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600&family=Noto+Sans+Thai:wght@400;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
/* Layout: top cyan navbar + menu strip, one centred column of colour-headed form cards (easyth-style theme). Login is a dark grid screen. Deliberately single light theme inside. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#f7f9fb; --line:#e5e9f0; --input-line:#cfd5dd;
  --ink:#1c2430; --muted:#5b6472;
  --nav:#00adef; --brand:#1670d6; --brand-ink:#ffffff; --brand-soft:#eef3ff; --action:#0e95ba; --action-dark:#0b7c99;
  --h-blue:#5b8def; --h-green:#2f9e5f; --h-purple:#8e63c9; --h-orange:#ef7d22; --h-gold:#d29b12;
  --sticker:#ffeb3b;
  --ok:#1b8a4b; --ok-soft:#eaf7ef; --warn:#b45309; --warn-soft:#fff8e1; --bad:#cc0000; --bad-soft:#fff3f3;
  --font-display:"Kanit","IBM Plex Sans Thai",system-ui,sans-serif;
  --font-body:"IBM Plex Sans Thai","Noto Sans Thai",Tahoma,sans-serif;
  --r:8px; color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14.5px;line-height:1.5}
button,input,select{font:inherit;color:inherit}

/* top navbar */
.shell{min-height:100%;display:flex;flex-direction:column}
.topwrap{padding-block:12px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar{max-width:1080px;margin:0 auto;background:var(--nav);border-radius:6px;padding:10px 20px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px 14px;box-shadow:0 2px 4px rgba(0,0,0,.1);font-family:var(--font-display);color:#fff}
.toplink{color:#fff;background:none;border:0;display:flex;align-items:center;gap:8px;padding:6px 16px;border-radius:20px;cursor:pointer;font-size:15px;font-weight:500;white-space:nowrap;transition:background .2s,transform .2s}
.toplink:hover{background:rgba(255,255,255,.18);transform:translateY(-2px)}
.toplink svg{width:18px;height:18px}
.tcenter{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 auto;justify-content:center}
.avatar{width:34px;height:34px;border-radius:50%;border:2px solid #fff;background:#fff;color:var(--nav);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.tuser{min-width:0;line-height:1.25}
.tuser .uname{font-weight:600;font-size:13px}
.tuser .urole{color:var(--sticker);font-size:11.5px;font-weight:600;margin-left:6px}
.tuser p{margin:0;font-size:14px}
.menu{max-width:1080px;margin:10px auto 0;display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.nav{background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:20px;cursor:pointer;color:var(--muted);font-size:14px;font-family:var(--font-display);white-space:nowrap;position:relative}
.nav svg{width:18px;height:18px;flex:none}
.nav[aria-current="page"]{background:var(--action);border-color:var(--action);color:#fff}
.nav .cnt{background:var(--bad);color:#fff;font-size:11px;border-radius:99px;padding:0 7px;font-weight:600}
.tabs,.mobile-who{display:none!important}

main{flex:1;min-width:0;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head h1{font-family:var(--font-display);font-size:24px;margin:0;font-weight:500;text-wrap:balance}
.sub{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{border-top:4px solid var(--h-blue)}
.kpi:nth-child(2){border-top-color:var(--h-green)} .kpi.warn{border-top-color:var(--h-orange)} .kpi.bad{border-top-color:var(--bad)}
.kpi .v{font-family:var(--font-display);font-size:26px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.25}
.kpi .l{color:var(--muted);font-size:13px}
.kpi.bad .v{color:var(--bad)} .kpi.warn .v{color:var(--warn)}
.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.h3{font-family:var(--font-display);font-size:16px;font-weight:500;margin:0}
.label{font-size:12px;color:var(--muted);letter-spacing:.03em}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.pill{display:inline-flex;align-items:center;font-size:12.5px;padding:3px 11px;border-radius:20px;font-weight:600;white-space:nowrap}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.brand{background:var(--brand-soft);color:var(--brand)}
.plate{border:1.5px solid #222;border-radius:6px;padding:1px 8px;text-align:center;background:#fff;color:#111;line-height:1.15;display:inline-block;min-width:86px}
.plate b{font-family:var(--font-display);font-weight:500;font-size:15px;display:block}
.plate small{font-size:10px}
.btn{border:0;border-radius:6px;padding:8px 16px;font-weight:500;cursor:pointer;background:var(--action);color:#fff;font-size:14px;white-space:nowrap;font-family:var(--font-display)}
.btn:hover{background:var(--action-dark)}
.btn.ghost{background:var(--brand-soft);color:var(--brand)}
.btn.ghost:hover{background:#dfe8fb}
.btn.line{background:var(--surface);border:1px solid var(--input-line);color:var(--ink)}
.btn.line:hover{background:var(--surface-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.nav:focus-visible,.chip:focus-visible,.rowbtn:focus-visible,.toplink:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
input,select{background:#fff;border:1px solid var(--input-line);border-radius:6px;padding:0 10px;height:34px;width:100%;font-size:14px;color:var(--ink)}
input[type=checkbox],input[type=radio]{height:auto;accent-color:var(--brand)}
input[type=file]{padding:5px 8px}
input:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 2px rgba(22,112,214,.15)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:13px;color:var(--muted)}
.form{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 14px}
.form .full{grid-column:1/-1}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:500;color:#fff;background:var(--h-blue);font-size:13px;padding:8px 10px;white-space:nowrap}
th:first-child{border-radius:6px 0 0 0} th:last-child{border-radius:0 6px 0 0}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
tbody tr:nth-child(even) td{background:#f8fafc}
tr:last-child td{border-bottom:0}
.rowbtn{cursor:pointer}
.rowbtn:hover td{background:#eaf6fb}
.num{font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--input-line);background:#fff;border-radius:20px;padding:5px 14px;cursor:pointer;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--action);border-color:var(--action);color:#fff}
.list .li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.list .li:last-child{border-bottom:0}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:11px;color:var(--muted)}
.bars i{display:block;width:100%;background:#cfe0fb;border-radius:4px 4px 0 0}
.bars .today i{background:var(--nav)}
.smsbox{background:var(--surface-2);border:1px dashed var(--input-line);border-radius:6px;padding:12px;font-size:14px;white-space:pre-wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:#1c2430;color:#fff;padding:11px 16px;border-radius:8px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.dlg{position:fixed;inset:0;background:rgba(5,15,25,.45);display:flex;justify-content:flex-end;z-index:20}
.panel{background:var(--surface);width:440px;max-width:100%;height:100%;overflow-y:auto;padding:20px max(20px,env(safe-area-inset-right,0px)) 32px 20px;display:flex;flex-direction:column;gap:14px}
.dates{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dates .card{padding:10px}
.note{font-size:12px;color:#888}
.empty{color:var(--muted);text-align:center;padding:24px 0}

/* colour-headed form sections */
.sec{display:flex;flex-direction:column;gap:12px;padding-top:0;overflow:hidden}
.sech{margin:0 -16px;padding:9px 14px;font-weight:600;font-size:14px;color:#fff;background:var(--h-blue);display:flex;align-items:center;gap:8px;font-family:var(--font-body)}
.sech:not(:first-child){margin-top:4px}
.sech::before{content:"";width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.85)}
[data-sec="tax"] .sech{background:var(--h-green)}
[data-sec="tr"] .sech{background:var(--h-purple)}
[data-sec="ins"] .sech{background:var(--h-blue)}
[data-sec="k"] .sech{background:var(--h-orange)}
.sech.gold{background:var(--h-gold)} .sech.dark{background:#3d4b5c}
[data-svc]{border-width:2px;font-weight:600;padding:8px 16px;border-radius:8px;font-family:var(--font-display);font-weight:500}
[data-svc="tax"]{border-color:var(--h-green);color:var(--h-green)}
[data-svc="tr"]{border-color:var(--h-purple);color:var(--h-purple)}
[data-svc="ins"]{border-color:var(--h-blue);color:var(--h-blue)}
[data-svc="k"]{border-color:var(--h-orange);color:var(--h-orange)}
[data-svc="tax"][aria-pressed="true"]{background:var(--h-green);color:#fff}
[data-svc="tr"][aria-pressed="true"]{background:var(--h-purple);color:#fff}
[data-svc="ins"][aria-pressed="true"]{background:var(--h-blue);color:#fff}
[data-svc="k"][aria-pressed="true"]{background:var(--h-orange);color:#fff}
.billgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.billmain{display:flex;flex-direction:column;gap:16px;min-width:0}
.sticky{position:sticky;top:16px}
.billside .sech{background:#3d4b5c}
.receipt{display:flex;flex-direction:column;gap:10px}
.field .row input{min-width:0}
.sec a{color:var(--brand)}

/* login: dark grid screen */
.login{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding-block:48px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(ellipse 90% 45% at 50% 0%,#17306a 0%,rgba(10,16,32,0) 70%),
    linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px) 0 0/34px 34px,
    linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px) 0 0/34px 34px,#06080d;color:#e7ecf3}
.login .brand{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.login h1{font-family:var(--font-display);font-size:30px;margin:0;font-weight:600;color:#fff;letter-spacing:.01em}
.login h1 em{font-style:normal;color:#5ea2ff}
.login .tag{color:#a3adbd;font-size:13.5px}
.login .badge{margin-top:8px;border:1px solid #2f4f8f;background:rgba(40,80,160,.25);color:#d6e4ff;border-radius:20px;padding:5px 16px;font-size:13.5px;font-weight:600}
.lcard{position:relative;width:400px;max-width:100%;display:flex;flex-direction:column;gap:14px;padding:30px 28px 26px;background:rgba(24,26,32,.92);border:1px solid #30343d;border-radius:20px;box-shadow:0 30px 60px -20px rgba(0,0,0,.6);overflow:hidden}
.lcard::before,.lcard::after{content:"";position:absolute;width:260px;height:1px;background:linear-gradient(90deg,transparent,#3b74e0,transparent);pointer-events:none}
.lcard::before{top:40px;left:-80px;transform:rotate(-38deg)}
.lcard::after{bottom:46px;right:-90px;transform:rotate(-38deg)}
.lcard .eyebrow{font-size:12px;letter-spacing:.12em;color:#8b93a1;font-weight:600}
.lcard h2{font-family:var(--font-display);font-size:22px;margin:-8px 0 4px;color:#fff;font-weight:600}
.lcard .field>span{color:#a3adbd}
.lcard input:not([type=checkbox]){background:#23262d;border:1px solid #3a3f49;color:#e7ecf3;height:40px;border-radius:10px;padding-left:38px}
.lcard input:focus{border-color:#4a8cff;box-shadow:0 0 0 3px rgba(74,140,255,.18)}
.ifield{position:relative}
.ifield svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:#8b93a1;pointer-events:none}
.remember{display:flex;align-items:center;gap:8px;color:#d0d6df;font-size:14px}
.remember input{width:18px;height:18px;accent-color:#3b82f6}
.lbtn{border:0;border-radius:12px;padding:13px;font-family:var(--font-display);font-size:16.5px;font-weight:500;color:#fff;background:linear-gradient(180deg,#4a8ef5,#2563d9);box-shadow:0 10px 24px -6px rgba(59,130,246,.55);cursor:pointer}
.lbtn:hover{filter:brightness(1.08)}
.lbtn:focus-visible{outline:2px solid #9cc2ff;outline-offset:2px}
.divider{display:flex;align-items:center;gap:12px;color:#7c8492;font-size:12.5px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:#353a44}
.demo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.demo button{background:#1d2026;border:1px solid #353a44;border-radius:10px;padding:12px 8px;cursor:pointer;text-align:center;color:#e7ecf3;display:flex;flex-direction:column;gap:4px}
.demo button:hover{border-color:#4a8cff}
.demo span{font-size:11.5px;color:#8b93a1}
.demo b{font-variant-numeric:tabular-nums;font-size:14.5px}
.err{color:#ff8a8a;font-size:13px}
.lfoot{color:#5f6775;font-size:12.5px}
.lfoot b{color:#9aa3b2}

@media (max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}.form{grid-template-columns:1fr 1fr}.billgrid{grid-template-columns:1fr}.sticky{position:static}}
@media (max-width:640px){
  .topbar{padding:8px 12px}
  .tleft{order:1}.tright{order:2}
  .tcenter{order:3;flex:1 1 100%;justify-content:flex-start}
  .toplink{padding:6px 10px;font-size:14px}
  .form{grid-template-columns:1fr}
  .hide-sm{display:none}
  .lcard{padding:26px 20px 22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ===== easyth-matched theme (from their style.css) ===== */
:root{--bg:#ffffff;--input-line:#cfd8dc;--action:#0e95ba;--action-dark:#0b7c99;--font-body:Tahoma,"IBM Plex Sans Thai","Noto Sans Thai",sans-serif}
body{font-size:14px;line-height:22px;color:#000}
.topbar{background:linear-gradient(180deg,#00adef 0%,#00adef 100%)}
main{background:#fff}
input,select{font-family:Tahoma,Arial,"IBM Plex Sans Thai",sans-serif;font-size:13px;border:1px solid #cfd8dc;border-radius:8px;height:30px;padding:0 8px;transition:.2s}
select{padding:0 28px 0 10px;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg fill='%23666' height='20' viewBox='0 0 20 20' width='20' xmlns='http://www.w3.org/2000/svg'><path d='M5 7l5 6 5-6z'/></svg>");background-repeat:no-repeat;background-position:right 8px center;background-size:14px;box-shadow:0 1px 2px rgba(0,0,0,.06);cursor:pointer}
select:hover{border-color:#0e95ba;box-shadow:0 2px 6px rgba(0,0,0,.1)}
input:focus,select:focus{border-color:#0e95ba;box-shadow:0 0 0 3px rgba(14,149,186,.15)}
.card{border-radius:14px;border:.5px solid #e0e0e5}
.field>span{color:#444;font-size:13px}
.sec{background:#f5f5f5;border:0;border-radius:10px;padding:12px 14px;overflow:visible}
/* sec-head: big gradient bars */
.sech{margin:0;padding:10px 12px;font-size:15px;font-weight:bold;color:#fff;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.15);background:linear-gradient(to right,#4B3FBF,#A9A2E8);font-family:Tahoma,"IBM Plex Sans Thai",sans-serif}
.sech:not(:first-child){margin-top:4px}
.sech::before{display:none}
.sech.orange{background:linear-gradient(to right,#B06F2E,#F3B37A)}
.sech.teal,.billside .sech{background:linear-gradient(to right,#0077B6,#5ED3FF)}
.sech.check{background:#5b8def;box-shadow:none;font-size:14px}
/* subsec-head: tinted with coloured left border */
[data-sec] .sech{padding:5px 10px;border-radius:0 8px 8px 0;border-left:3px solid;font-size:15px;font-weight:500;box-shadow:none}
[data-sec="tax"] .sech{background:#E9F7EF;border-color:#2FA36B;color:#02492b}
[data-sec="tr"] .sech{background:#EDECFB;border-color:#5856d6;color:#3D3AA8}
[data-sec="ins"] .sech{background:#EAF4FF;border-color:#3E8FD9;color:#084975}
[data-sec="k"] .sech{background:#F1E8D4;border-color:#8B6A2B;color:#8B6A2B}
/* tab buttons */
#svc{gap:10px;padding:6px 0}
[data-svc]{display:inline-flex;align-items:center;gap:6px;padding:7px 20px;border-radius:8px;border:1.5px solid #b19e5d;font-size:15px;font-weight:500;cursor:pointer;background:#f1efe8;color:#636366;font-family:inherit;white-space:nowrap;transition:background .2s,color .2s,border-color .2s,transform .15s,box-shadow .2s;box-shadow:0 3px 8px rgba(0,0,0,.15)}
[data-svc]:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.2)}
[data-svc]::after{content:"";width:8px;height:8px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);margin-left:2px;opacity:.55;transition:transform .25s}
[data-svc][aria-pressed="true"]::after{transform:rotate(-135deg);opacity:.9}
[data-svc="tax"]{background:#E7F8EC;color:#1E7A34;border-color:#A9E0BA}
[data-svc="tr"]{background:#EDECFB;color:#3D3AA8;border-color:#C3C1F0}
[data-svc="ins"]{background:#EAF3FE;color:#0056B3;border-color:#B7D8FA}
[data-svc="k"]{background:#F9F6EF;color:#8B6A2B;border-color:#DCCB9F}
[data-svc="tax"][aria-pressed="true"]{background:#077f25;color:#fff;border-color:#34c759;box-shadow:0 4px 12px rgba(52,199,89,.35)}
[data-svc="tr"][aria-pressed="true"]{background:#5856d6;color:#fff;border-color:#5856d6;box-shadow:0 4px 12px rgba(88,86,214,.35)}
[data-svc="ins"][aria-pressed="true"]{background:#007AFF;color:#fff;border-color:#007AFF;box-shadow:0 4px 12px rgba(0,122,255,.35)}
[data-svc="k"][aria-pressed="true"]{background:#A67C2D;color:#fff;border-color:#A67C2D;box-shadow:0 4px 12px rgba(166,124,45,.35)}
/* buttons */
.btn{border-radius:10px;padding:10px 18px;font-size:14.5px;font-weight:500;background:#0f75bd;color:#fff;box-shadow:0 6px 14px rgba(0,0,0,.18);transition:.2s ease;font-family:inherit}
.btn:hover{background:#fff;color:#0f75bd;transform:translateY(-1px);box-shadow:0 10px 20px rgba(0,0,0,.25)}
.btn.ghost{background:#e9eef5;color:#333;box-shadow:none}
.btn.ghost:hover{background:#d6dee8;color:#0f75bd}
.btn.line{background:#f2f2f7;border:1.5px solid #d1d1d6;color:#636366;border-radius:20px;box-shadow:0 2px 6px rgba(0,0,0,.04)}
.btn.line:hover{background:#8e8e93;color:#fff;border-color:#8e8e93}
.panel .btn,.receipt~.btn{border-radius:20px}
#x-go{background:#0e95ba;border-radius:6px;box-shadow:none;padding:6px 14px}
#x-go:hover{background:#0b7c99;color:#fff}
/* nav menu: ios capsule style */
.nav{background:#f2f2f7;border:1.5px solid #d1d1d6;color:#636366;border-radius:20px;font-family:inherit;font-weight:500}
.nav:hover{background:#8e8e93;color:#fff;border-color:#8e8e93}
.nav[aria-current="page"]{background:#0e95ba;border-color:#0e95ba;color:#fff}
/* tables */
th{background:#f5f5f5;color:#1c1c1e;font-weight:600;border-bottom:1px solid #e6e6e6;border-radius:0!important}
td{border-bottom:1px solid #e6e6e6}
tbody tr:nth-child(even) td{background:#fff}
.rowbtn:hover td{background:#f6f6f6}
/* status badges like their hdr-badge / renew-badge */

/* searchable select + ตำบลอัตโนมัติ */
.ss{position:relative;width:100%;min-width:0}
.ss-in{padding-right:28px!important;background:#fff url("data:image/svg+xml;utf8,<svg fill='%23666' height='20' viewBox='0 0 20 20' width='20' xmlns='http://www.w3.org/2000/svg'><path d='M5 7l5 6 5-6z'/></svg>") no-repeat right 8px center/14px;cursor:pointer}
.ss-in:focus{cursor:text}
.ss-dd{position:absolute;left:0;right:0;top:calc(100% + 3px);z-index:40;background:#fff;border:1px solid #c9d6e3;border-radius:8px;box-shadow:0 8px 22px rgba(15,23,42,.16);max-height:240px;overflow:auto;font-size:13px}
.ac-dd{min-width:min(340px,86vw)}
.ss-it{padding:7px 10px;cursor:pointer;border-bottom:1px solid #f1f4f8;line-height:1.45}
.ss-it.sel{font-weight:bold;color:#0e7fae}
.ss-it.on,.ss-it:hover{background:#0e95ba;color:#fff}
.ss-it small{color:#64748b}.ss-it.on small,.ss-it:hover small{color:#e0f6ff}
.ac-zip{float:right;font-family:ui-monospace,monospace;color:#0e7fae}.ss-it.on .ac-zip,.ss-it:hover .ac-zip{color:#fff}
.ss-no{padding:8px 10px;color:#94a3b8}
.ss-dd{scroll-margin-bottom:150px}
.ss-gl{padding:5px 10px 3px;font-size:11px;font-weight:700;color:#888;background:#f0f0f0;border-top:1px solid #e0e0e0;letter-spacing:.03em;pointer-events:none}
.ss-gi{padding-left:20px}
.ss-dd:not(.ac-dd){min-width:100%;width:max-content;max-width:min(420px,92vw)}
.ss-dd:not(.ac-dd) .ss-it{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
input.ac-fill{background:#eaf3de!important;transition:background .9s}
/* หน้าแก้ไขบิล */
.edhd{text-align:center;margin:6px 0 10px}
.edhd h1{font-size:20px;margin:0}
.edwarn{color:#A32D2D;margin:6px 0 0;font-size:15px}
.edlock{display:inline-flex;align-items:center;gap:8px;background:#FFF3F3;border:1px solid #F5C6C6;color:#A32D2D;font-size:13.5px;font-weight:600;padding:9px 14px;border-radius:10px;margin:10px 0 6px;text-align:left}
.edlock svg{flex:none}
#bill input.locked{background:#F0F0ED!important;color:#8e8e93!important;border-color:#E4E4E0!important;cursor:not-allowed}
.chip:disabled{opacity:.55;cursor:not-allowed}.chip[aria-pressed=true]:disabled{opacity:1}
.paylock{display:flex;align-items:center;gap:6px;color:#aeaeaa}
.paymore{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;max-width:480px;margin:6px 0 4px;background:linear-gradient(135deg,#C2410C,#9A3412);color:#fff;font-weight:600;font-size:14px;border:0;padding:11px 16px;border-radius:10px;box-shadow:0 4px 12px rgba(194,65,12,.28);cursor:pointer}
.svo{position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:9999;display:flex;align-items:center;justify-content:center}
.svo-box{background:#fff;border-radius:20px;padding:40px 36px 32px;text-align:center;box-shadow:0 10px 30px rgba(15,23,42,.15);max-width:340px;width:90%}
.svo-ic{width:66px;height:66px;border-radius:50%;background:#EAF3DE;display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
.svo-spin{animation:svospin .8s linear infinite}@keyframes svospin{to{transform:rotate(360deg)}}
.svo-t{font-size:17px;font-weight:600;margin-bottom:6px}.svo-s{font-size:13px;color:#8e8e93;margin-bottom:18px}
.svo-bar{height:4px;background:#EDF0F3;border-radius:4px;overflow:hidden}.svo-bar i{display:block;height:100%;width:20%;background:#27500A;transition:width .6s}
/* แถวรวมหลายช่อง แบบ easyth */
#bill .field>.fc{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
#bill .fc>input,#bill .fc>select{flex:0 1 auto;max-width:100%}
#bill .fc>.ss{flex:0 1 auto;max-width:100%}
#bill .il{color:#000;font-size:14px;white-space:nowrap}
#bill .hint{color:#666;font-size:12.5px}
#bill .req{color:#cc0000;font-weight:normal;margin-right:1px}
.dltbtn{background:#D1C1E4;color:#fff!important;font-size:12px;padding:5px 10px;border-radius:6px;text-decoration:none;white-space:nowrap}
.dltbtn:hover{background:#b9a3d6}
.tro-must{margin:0!important;color:#c53030!important;font-weight:bold;font-size:14px!important;text-align:center}
@media (max-width:640px){#bill .fc>input,#bill .fc>select,#bill .fc>.ss{flex:1 1 90px;width:auto!important}#bill .hint,#bill .autohint{flex-basis:100%}#bill .fc>.il{flex-basis:100%;font-weight:600;color:#444;margin-top:2px}}
#bill .field>input.money{max-width:96px}
#bill .field>input.wide,#bill .field.full>input.wide{max-width:400px}
#bill .sech svg{flex:none}
.mbox{display:inline-flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;font-size:14px}
.mbox.blue{background:#eef2ff}.mbox.blue b{color:#1d4ed8}
.mbox.red{background:#fff1f1}.mbox.red b{color:#c81e1e}
.autohint{color:#c81e1e;font-size:13.5px}
.autorow{flex-wrap:wrap;padding:0 4px}
@media (max-width:640px){.mbox{flex-wrap:wrap;width:100%}.mbox input{flex:1}}
.mbox.green{background:#EAF7EF;flex-wrap:wrap}.mbox.green b{color:#0F6E45}
#b-tro{display:flex;align-items:center;justify-content:center;gap:8px;background:#fff5f5;border-radius:6px;padding:8px 16px;width:max-content;max-width:100%;margin:0 auto!important}
#b-tro[hidden]{display:none}

/* ===== สำหรับลูกค้าเซ็นต์รับเอกสาร (paper_type) ===== */
.pt{font-family:Tahoma,sans-serif;color:#1c1c1e}
.pt-head{display:flex;align-items:center;justify-content:space-between;margin:4px 0 20px;flex-wrap:wrap;gap:10px}
.pt-title{font-size:15px;font-weight:600}.pt-sub{font-size:14px;margin-left:4px}
.pt-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pt-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:999px;font-family:Tahoma,sans-serif;font-size:13.5px;font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none;transition:background .15s,color .15s,box-shadow .15s}
.pt-btn svg{flex-shrink:0}
.pt-print,.pt-print:link,.pt-print:visited{border:1.5px solid #d1d1d6;background:#f2f2f7;color:#636366}
.pt-print:hover{background:#8e8e93;color:#fff;box-shadow:0 4px 12px rgba(142,142,147,.25)}
.pt-sign,.pt-sign:link,.pt-sign:visited{border:1.5px solid #5B5BD6;background:transparent;color:#5B5BD6;font-weight:600}
.pt-sign:hover{background:#5B5BD6;color:#fff}
.pt-sign .ic-circle{width:18px;height:18px;border-radius:50%;background:rgba(91,91,214,.12);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pt-sign:hover .ic-circle{background:rgba(255,255,255,.22)}
.pt-tbl{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;border:.5px solid #e0e0e5;table-layout:fixed}
.pt-tbl th{background:#EBF4FB!important;color:#0C447C!important;font-size:14px;font-weight:600;padding:11px 10px;text-align:center;border-bottom:1px solid #B5D4F4}
.pt-tbl td{padding:10px;font-size:14px;text-align:center;border-bottom:.5px solid #f2f2f7;color:#1c1c1e;vertical-align:middle;word-break:break-word;white-space:normal}
.pt-tbl tbody tr:last-child td{border-bottom:none}
.pt-tbl tbody tr:hover td{background:#f7fbff}
.pt-plate{display:inline-flex;align-items:center;gap:5px;background:#E6F1FB;color:#0C447C;padding:4px 10px;border-radius:8px;font-size:14px;font-weight:500}
.pt-doc{display:inline-block;background:#EAF3DE;color:#27500A;padding:3px 9px;border-radius:8px;font-size:13px;margin:2px}
.pt-signbox{width:100%;height:34px;border:1px dashed #c8c8cc;border-radius:6px;background:#fafafa}
@media (max-width:680px){
  .pt-head{flex-direction:column;align-items:flex-start}.pt-actions{width:100%}.pt-btn{flex:1;justify-content:center}
  .pt-tbl{display:block;border:0;background:none}.pt-tbl thead{display:none}.pt-tbl tbody{display:block}
  .pt-tbl tbody tr{display:flex;flex-direction:column;background:#fff;border:.5px solid rgba(0,0,0,.08);border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
  .pt-tbl td{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0;border:none;text-align:left!important}
  .pt-tbl td[data-label]::before{content:attr(data-label);color:#8e8e93;font-size:13px;flex-shrink:0}
  .pt-tbl td:nth-child(1){display:none}
  .pt-tbl td:nth-child(2){order:-2;padding-bottom:8px;margin-bottom:6px;border-bottom:.5px solid rgba(0,0,0,.06)}
  .pt-tbl td .pt-signbox{width:140px;margin-left:auto}
}
@media print{.topwrap,.tabs,.toast,.non-printable{display:none!important}main{padding:0!important}.pt-tbl tbody tr:hover td{background:none}}
.tright{display:flex;align-items:center;gap:2px}@media (max-width:420px){[data-chpw] span{display:none}}
.tbranch{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;margin-left:6px;font-size:12px;color:inherit;opacity:.9}.tbranch select{font:inherit;padding:1px 4px;border-radius:4px;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.15);color:inherit}.tbranch option{color:#000}

<script>
const $=s=>document.querySelector(s);
const TODAY=(()=>{const d=new Date();d.setHours(0,0,0,0);return d})();
let LIVE=false; // true = ใช้ฐานข้อมูลจริง (Supabase)
const DAY=864e5;
const TH_M=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const fmt=d=>`${d.getDate()} ${TH_M[d.getMonth()]} ${String(d.getFullYear()+543).slice(2)}`;
const plus=n=>new Date(TODAY.getTime()+n*DAY);
const daysTo=d=>Math.round((d-TODAY)/DAY);
const baht=n=>n.toLocaleString('th-TH',{maximumFractionDigits:2})+' ฿';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}

/* sample records (ตัวอย่าง) */
let seq=0;
const mk=(plate,prov,name,tel,type,model,cc,tax,prb,ins,insCo)=>({id:++seq,plate,prov,name,tel,type,model,cc,tax:plus(tax),prb:plus(prb),ins:ins==null?null:plus(ins),insCo,history:[{d:plus(tax-365),what:'ตรวจสภาพ + ต่อภาษี',amt:type==='มอเตอร์ไซค์'?160:2350}]});

function carTax(cc){let t=Math.min(cc,600)*.5;if(cc>600)t+=(Math.min(cc,1800)-600)*1.5;if(cc>1800)t+=(cc-1800)*4;return t}
function pickupTax(kg){const tb=[[500,300],[750,450],[1000,600],[1250,750],[1500,900],[1750,1050],[2000,1350],[2500,1650],[3000,1950],[3500,2250],[4000,2550],[4500,2850],[5000,3150],[6000,3450],[7000,3750]];for(const[w,f]of tb)if(kg<=w)return f;return 4050}

function status(d){
  if(!d)return '<span class="pill brand">ไม่มี</span>';
  const n=daysTo(d);
  if(n<0)return `<span class="pill bad">เลย ${-n} วัน</span>`;
  if(n<=7)return `<span class="pill bad">อีก ${n} วัน</span>`;
  if(n<=30)return `<span class="pill warn">อีก ${n} วัน</span>`;
  return `<span class="pill ok">${fmt(d)}</span>`;
}

      :`<div class="eempty"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M8 12l3 3 5-6"/></svg><div>ไม่มีรายการที่ใกล้หมดอายุในหมวดนี้</div></div>`;

  document.querySelectorAll('[data-ek]').forEach(b=>b.onclick=()=>{expKind=b.dataset.ek;R.home()});
  $('#eq').oninput=e=>{expQ=e.target.value;draw()};
  draw();
};

/* หน้ารายได้ + ยอดค้าง และ หน้าผ่อนชำระประกัน (โครงเดียวกัน) */
function moneyPage(cfg){
  const TD=TODAY.getDate(),TMo=TODAY.getMonth()+1,TY=TODAY.getFullYear();
  const st=cfg.st||(cfg.st={tab:cfg.defTab,mode:'day',d:TD,m:TMo,y:TY,from:[TD,TMo,TY],to:[TD,TMo,TY],q:'',open:new Set()});
  const opt=(arr,v)=>arr.map(([k,t])=>`<option value="${k}"${String(k)===String(v)?' selected':''}>${t}</option>`).join('');
  const DD=[...Array(31)].map((_,i)=>[i+1,i+1]),MM=TH_MF.map((t,i)=>[i+1,t]),YY=[...Array(10)].map((_,i)=>[TY+1-i,TY+544-i]);
  const tri=(p,v,lbl)=>`<span class="sm-field-wrap" data-w="${p}"><label>${lbl[0]}</label><select id="f-${p}d">${opt(DD,v[0])}</select></span><span class="sm-field-wrap" data-w="${p}"><label>${lbl[1]}</label><select id="f-${p}m">${opt(MM,v[1])}</select></span><span class="sm-field-wrap" data-w="${p}"><label>ปี</label><select id="f-${p}y">${opt(YY,v[2])}</select></span>`;
  $('#view').innerHTML=`<div class="sm">
  <div class="sm-topbar"><span class="tb-title">${cfg.title}</span>
    <button type="button" class="sm-alldebt" id="sm-alldebt">🔍 ${cfg.alldebt}</button>
    <div class="sm-topbar-actions"><a href="#" class="btn-csv" id="sm-csv">📊 Export Excel</a><a href="#" class="btn-printA4" id="sm-print">🖨️ พิมพ์รายงาน A4</a></div></div>
  <div class="sm-cardhint">กดเลือกสถานะที่ต้องการดู 👇 (คลิกการ์ดเพื่อสลับดูตาราง) — ยอดของ <span id="sm-period"></span></div>
  <div class="sm-summary">
    <div class="sm-scard blue" data-tab="all"><div class="sm-scard-lbl">${cfg.labels[0]}</div><div class="sm-scard-val" id="sm-v-all">–</div><div class="sm-scard-sub" id="sm-s-all"></div></div>
    <div class="sm-scard orange" data-tab="debt"><div class="sm-scard-lbl">${cfg.labels[1]}</div><div class="sm-scard-val" id="sm-v-debt">–</div><div class="sm-scard-sub" id="sm-s-debt"></div>${cfg.debtNote?`<div class="sm-scard-note">${cfg.debtNote}</div>`:''}</div>
    <div class="sm-scard green" data-tab="done"><div class="sm-scard-lbl">${cfg.labels[2]}</div><div class="sm-scard-val" id="sm-v-done">–</div><div class="sm-scard-sub" id="sm-s-done"></div></div>
  </div>
  <div class="sm-filterbar">
    <span class="sm-field-wrap"><label>ดูข้อมูลแบบ</label><select id="f-mode">${opt([['day','รายวัน'],['month','รายเดือน'],['year','รายปี'],['range','ช่วงวันที่']],st.mode)}</select></span>
    <div class="sm-daterow">${tri('',[st.d,st.m,st.y],['วันที่','เดือน'])}${tri('a',st.from,['จากวันที่','เดือน'])}<span class="sm-sep" data-w="r">ถึง -</span>${tri('b',st.to,['วันที่','เดือน'])}</div>
    <button type="button" class="btn-apply" id="f-apply">กรองข้อมูล</button>
    <a href="#" class="sm-clear-filter" id="f-clear">↺ กลับไปวันนี้</a>
    <div class="sm-search"><div class="sm-search-wrap"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><input type="text" id="f-q" autocomplete="off" placeholder="ค้นหา ทะเบียนรถ / ชื่อลูกค้า" value="${esc(st.q)}"></div>
    <button class="btn-icon red" id="f-x" title="ล้างการค้นหา">✕</button></div>
  </div>
  <div class="row-count" id="sm-count"></div>
  <div class="tbl-wrap" id="sm-tbl"></div></div>`;
  const v=id=>+$('#'+id).value,ymd=(y,m,d)=>y*10000+m*100+d;
  const inPeriod=b=>{const x=b.d,k=ymd(x.getFullYear(),x.getMonth()+1,x.getDate());
    if(st.mode==='all')return true;
    if(st.mode==='range'){let a=ymd(st.from[2],st.from[1],st.from[0]),z=ymd(st.to[2],st.to[1],st.to[0]);if(a>z)[a,z]=[z,a];return k>=a&&k<=z}
    return x.getFullYear()===+st.y&&(st.mode==='year'||x.getMonth()+1===+st.m)&&(st.mode!=='day'||x.getDate()===+st.d)};
  const full=(d,m,y)=>`วันที่ ${d} เดือน${TH_MF[m-1]} พ.ศ. ${y+543}`;
  const isToday=()=>st.mode==='day'&&+st.d===TD&&+st.m===TMo&&+st.y===TY;
  const countUp=(el,to)=>{const from=+(el.dataset.raw||0),t0=performance.now();const step=t=>{const p=Math.min((t-t0)/700,1),e=1-Math.pow(1-p,3);el.textContent=money(from+(to-from)*e)+' บาท';p<1?requestAnimationFrame(step):el.dataset.raw=to};requestAnimationFrame(step)};
  const sync=()=>{const md=st.mode;
    document.querySelectorAll('[data-w=""]').forEach((e,i)=>e.style.display=(md==='range'||md==='all')?'none':(i===0&&md!=='day')||(i===1&&md==='year')?'none':'');
    document.querySelectorAll('[data-w="a"],[data-w="b"],[data-w="r"]').forEach(e=>e.style.display=md==='range'?'':'none');
    $('#f-clear').style.display=isToday()?'none':'';
    $('#sm-period').textContent=md==='all'?'ทั้งหมด (ไม่จำกัดวันที่)':isToday()?'วันนี้':md==='range'?(()=>{const a=full(...st.from),z=full(...st.to);return a===z?a:a+' ถึง '+z})():md==='day'?full(+st.d,+st.m,+st.y):md==='month'?`${TH_MF[st.m-1]} พ.ศ. ${+st.y+543}`:`พ.ศ. ${+st.y+543}`;
    document.querySelectorAll('.sm-scard').forEach(c=>c.classList.toggle('active-card',c.dataset.tab===st.tab))};
  const draw=()=>{sync();
    const per=cfg.recs().filter(r=>inPeriod(r.b)),debt=per.filter(r=>r.amt-r.paid>0.004),done=per.filter(r=>r.amt-r.paid<=0.004);
    countUp($('#sm-v-all'),per.reduce((s,r)=>s+r.amt,0));countUp($('#sm-v-debt'),debt.reduce((s,r)=>s+r.amt-r.paid,0));countUp($('#sm-v-done'),done.reduce((s,r)=>s+r.amt,0));
    $('#sm-s-all').textContent=per.length+' '+cfg.unit;$('#sm-s-debt').textContent=debt.length+' '+cfg.unit;$('#sm-s-done').textContent=done.length+' '+cfg.unit;
    const q=st.q.trim().toLowerCase();
    const rows=(st.tab==='debt'?debt:st.tab==='done'?done:per).filter(r=>!q||(r.b.plate+' '+r.b.name).toLowerCase().includes(q)).sort((a,z)=>z.b.d-a.b.d||(z.b.t>a.b.t?1:-1));
    $('#sm-count').textContent=`แสดง ${rows.length} รายการ`;
    $('#sm-tbl').innerHTML=rows.length?`<table class="sm-tbl"><thead><tr><th>#</th>${cfg.head.map(h=>`<th>${h}</th>`).join('')}<th class="c">สถานะ</th><th></th></tr></thead><tbody>${rows.map((r,n)=>{const op=st.open.has(r.b.id);return `<tr class="sm-r${op?' open':''}" data-b="${r.b.id}"><td class="sm-n">${n+1}</td>${cfg.row(r)}<td class="c" data-l="สถานะ">${r.amt-r.paid>0.004?`<span class="st-debt">ค้างชำระ</span>${r.paid===0?'<div class="sm-never">(ยังไม่เคยรับเงิน)</div>':''}`:`<span class="st-ok">${cfg.okLabel}</span>`}</td><td class="chev">›</td></tr><tr class="sm-x"${op?'':' hidden'}><td colspan="${cfg.head.length+3}">${cfg.exp(r)}</td></tr>`}).join('')}</tbody></table>`:`<div class="empty-state"><div class="es-icon">📭</div><p>ไม่พบข้อมูลในช่วงที่เลือก</p></div>`;
    document.querySelectorAll('.sm-r').forEach(tr=>tr.onclick=e=>{if(e.target.closest('a,button'))return;const id=+tr.dataset.b;st.open.has(id)?st.open.delete(id):st.open.add(id);tr.classList.toggle('open');tr.nextElementSibling.hidden=!tr.nextElementSibling.hidden});
  };
  const apply=()=>{st.mode=$('#f-mode').value;st.d=v('f-d');st.m=v('f-m');st.y=v('f-y');st.from=[v('f-ad'),v('f-am'),v('f-ay')];st.to=[v('f-bd'),v('f-bm'),v('f-by')];draw()};
  document.querySelectorAll('.sm-filterbar select').forEach(s=>s.onchange=apply);
  $('#f-apply').onclick=apply;
  $('#f-clear').onclick=e=>{e.preventDefault();Object.assign(st,{mode:'day',d:TD,m:TMo,y:TY,from:[TD,TMo,TY],to:[TD,TMo,TY]});R[cur]()};
  $('#sm-alldebt').onclick=()=>{st.mode='all';st.tab='debt';draw()};
  document.querySelectorAll('.sm-scard').forEach(c=>c.onclick=()=>{st.tab=c.dataset.tab;draw()});
  let tm;$('#f-q').oninput=e=>{clearTimeout(tm);tm=setTimeout(()=>{st.q=e.target.value;draw()},250)};
  $('#f-x').onclick=()=>{$('#f-q').value='';st.q='';draw()};
  $('#sm-csv').onclick=e=>{e.preventDefault();toast('ตัวอย่าง: ระบบจริงจะดาวน์โหลดไฟล์ Excel ของช่วงที่เลือก')};
  $('#sm-print').onclick=e=>{e.preventDefault();toast('ตัวอย่าง: ระบบจริงจะเปิดรายงาน A4 ให้พิมพ์')};
  draw();
}

  const draw=()=>{
    const s=q.trim().replace(/[\s-]/g,'').toLowerCase();
    let list=cars.filter(c=>!s||(c.plate+c.name+c.tel).replace(/[\s-]/g,'').toLowerCase().includes(s));
    const d=c=>c[cTab];
    list=list.filter(c=>d(c));
    if(cMonth)list=list.filter(c=>d(c)&&d(c).getMonth()+1===cMonth);
    if(cSort==='soon')list=list.filter(c=>d(c)&&daysTo(d(c))>=0&&daysTo(d(c))<=30).sort((a,b)=>d(a)-d(b));
    else if(cSort==='expired')list=list.filter(c=>d(c)&&daysTo(d(c))<0).sort((a,b)=>d(a)-d(b));
    else list=list.slice().sort((a,b)=>b.created-a.created);
    $('#ccount').textContent=list.length+' รายการ';
    $('#rows').innerHTML=list.map((c,i)=>`<tr class="rowbtn" data-open="${c.id}" tabindex="0"><td class="sub">${i+1}</td><td class="num">${fmt(c.created)}</td><td>${esc(c.name)}</td><td>${c.tel?`<b class="tel">${esc(c.tel)}</b>`:'–'}${c.note?`<div class="sub">${esc(c.note)}</div>`:''}</td><td class="hide-sm typ">${TYPEFULL[c.type]||esc(c.type)}</td><td><b class="${d(c)&&daysTo(d(c))<0?'plate-exp':''}">${esc(c.plate)}</b><div class="sub">${esc(c.prov)}</div></td>${cTab==='ins'?`<td class="insco">${c.insCo?`<b>${esc(c.insCo.replace(/\s*ชั้น.*$/,''))}</b><div class="sub">${esc((c.insCo.match(/ชั้น.*$/)||[''])[0].replace('ชั้น','ประเภท'))}</div>${c.insNote?`<div class="sub"><i>หมายเหตุ: ${esc(c.insNote)}</i></div>`:''}`:'–'}</td>`:cTab==='k'?`<td class="knote">${esc(c.kNote||'–')}</td>`:''}<td>${expPill(d(c))}</td></tr>`).join('')||`<tr><td colspan="8"><div class="eempty">ไม่พบรายการ</div></td></tr>`;
  };
  document.querySelectorAll('[data-ct]').forEach(b=>b.onclick=()=>{cTab=b.dataset.ct;R.cust()});
  document.querySelectorAll('[data-mo]').forEach(b=>b.onclick=()=>{cMonth=cMonth===+b.dataset.mo?0:+b.dataset.mo;R.cust()});

  $('#q').oninput=e=>{q=e.target.value;draw()};draw();

/* ช่อง select ที่พิมพ์ค้นหาได้ (แบบ searchable dropdown ของ easyth) */
function ssel(sel){
  const w=document.createElement('div');w.className='ss';
  const inp=document.createElement('input');inp.className='ss-in';inp.placeholder='เลือก - พิมพ์ค้นหา...';inp.autocomplete='off';
  const dd=document.createElement('div');dd.className='ss-dd';dd.hidden=true;
  let items=[],ai=-1;
  const txt=()=>sel.selectedIndex>=0?sel.options[sel.selectedIndex].text:'';
  const mark=()=>dd.querySelectorAll('.ss-it').forEach((el,i)=>{el.classList.toggle('on',i===ai);if(i===ai)el.scrollIntoView({block:'nearest'})});
  const draw=f=>{f=(f||'').toLowerCase();items=[];let h='';const one=(o,g)=>{if(!o.value||!o.text.toLowerCase().includes(f))return'';items.push(o);return `<div class="ss-it${g?' ss-gi':''}${o.value===sel.value?' sel':''}" data-i="${items.length-1}">${esc(o.text)}</div>`};
    [...sel.children].forEach(c=>{if(c.tagName==='OPTGROUP'){const inner=[...c.children].map(o=>one(o,1)).join('');if(inner)h+=`<div class="ss-gl">${esc(c.label)}</div>`+inner}else h+=one(c)});
    ai=items.findIndex(o=>o.value===sel.value);dd.innerHTML=h||'<div class="ss-no">ไม่พบรายการ</div>';mark()};
  const pick=i=>{const o=items[i];if(!o)return;sel.value=o.value;inp.value=o.text;dd.hidden=true;sel.dispatchEvent(new Event('change',{bubbles:true}))};
  inp.onfocus=()=>{inp.select();draw('');dd.hidden=false;dd.scrollIntoView({block:'nearest'})};
  inp.oninput=()=>{draw(inp.value);ai=items.length?0:-1;mark();dd.hidden=false};
  inp.onkeydown=e=>{if(e.key==='Enter')e.preventDefault();if(dd.hidden)return;
    if(e.key==='ArrowDown'){e.preventDefault();ai=Math.min(ai+1,items.length-1);mark()}
    else if(e.key==='ArrowUp'){e.preventDefault();ai=Math.max(ai-1,0);mark()}
    else if(e.key==='Enter')pick(ai);else if(e.key==='Escape'){dd.hidden=true;inp.value=txt()}};
  dd.onmousedown=e=>{e.preventDefault();const it=e.target.closest('.ss-it');if(it)pick(+it.dataset.i)};
  inp.onblur=()=>{dd.hidden=true;inp.value=txt()};
  if(sel.style.width)w.style.width=sel.style.width;sel.style.display='none';sel.parentNode.insertBefore(w,sel);w.append(inp,dd,sel);
  sel._ss=()=>{inp.value=txt()};sel._ss();
}
const ssRefresh=()=>document.querySelectorAll('#view select').forEach(s=>s._ss&&s._ss());
/* พิมพ์ตำบล แล้วเติม อำเภอ จังหวัด รหัสไปรษณีย์ ให้อัตโนมัติ */
function tumbolAC(inp,amp,prov,zip){
  const w=document.createElement('div');w.className='ss';if(inp.style.width)w.style.width=inp.style.width;inp.parentNode.insertBefore(w,inp);w.append(inp);
  const dd=document.createElement('div');dd.className='ss-dd ac-dd';dd.hidden=true;w.append(dd);
  let items=[],ai=0;inp.setAttribute('autocomplete','off');inp.placeholder='พิมพ์ชื่อตำบล แล้วเลือกจากรายการ';
  const mark=()=>dd.querySelectorAll('.ss-it').forEach((el,i)=>{el.classList.toggle('on',i===ai);if(i===ai)el.scrollIntoView({block:'nearest'})});
  const draw=()=>{const q=inp.value.trim();if(!q){dd.hidden=true;return}
    items=TUMBOL.filter(t=>t[0].includes(q)).sort((a,b)=>(b[0].startsWith(q))-(a[0].startsWith(q))).slice(0,30);ai=0;
    dd.innerHTML=items.map((t,i)=>`<div class="ss-it" data-i="${i}"><b>${esc(t[0])}</b> <small>» ${esc(t[1])} » ${esc(t[2])}</small> <span class="ac-zip">${t[3]}</span></div>`).join('')||'<div class="ss-no">ไม่พบตำบลนี้ในรายการตัวอย่าง กรอกอำเภอ จังหวัด รหัสไปรษณีย์เองได้</div>';
    if(dd.hidden){dd.hidden=false;dd.scrollIntoView({block:'nearest'})}mark()};
  const pick=i=>{const t=items[i];if(!t)return;inp.value=t[0];amp.value=t[1];prov.value=t[2];zip.value=t[3];prov._ss&&prov._ss();dd.hidden=true;
    [amp,zip].forEach(el=>{el.classList.add('ac-fill');setTimeout(()=>el.classList.remove('ac-fill'),900)})};
  inp.addEventListener('input',draw);
  inp.addEventListener('keydown',e=>{if(dd.hidden||!items.length)return;
    if(e.key==='ArrowDown'){e.preventDefault();ai=Math.min(ai+1,items.length-1);mark()}
    else if(e.key==='ArrowUp'){e.preventDefault();ai=Math.max(ai-1,0);mark()}
    else if(e.key==='Enter'){e.preventDefault();pick(ai)}else if(e.key==='Escape')dd.hidden=true});
  dd.onmousedown=e=>{e.preventDefault();const it=e.target.closest('.ss-it');if(it)pick(+it.dataset.i)};
  inp.addEventListener('blur',()=>{dd.hidden=true});
}

/* เปลี่ยนรหัสผ่านของตัวเอง */
document.addEventListener('click',e=>{if(!e.target.closest('[data-chpw]'))return;
  $('#panel').innerHTML=`<div class="row between"><h2 class="h3" style="font-size:18px">เปลี่ยนรหัสผ่าน</h2><button class="btn line" id="x">ปิด</button></div>
    <div class="card" style="display:flex;flex-direction:column;gap:12px">
      <div class="sub">บัญชี <b>${esc(user.name)}</b> · เปลี่ยนแล้วใช้รหัสใหม่ได้ทันทีทุกเครื่อง</div>
      <label class="field"><span>รหัสผ่านใหม่ (อย่างน้อย 6 ตัว)</span><input id="pw1" type="password" autocomplete="new-password"></label>
      <label class="field"><span>ยืนยันรหัสผ่านใหม่</span><input id="pw2" type="password" autocomplete="new-password"></label>
      <label class="row" style="gap:6px;font-size:13px"><input type="checkbox" id="pwshow" style="width:auto"> แสดงรหัส</label>
      <div class="err" id="pwerr" hidden style="color:#cc0000"></div>
      <button class="btn" id="pwok">บันทึกรหัสใหม่</button></div>`;
  $('#dlg').hidden=false;$('#pw1').focus();$('#x').onclick=()=>{$('#dlg').hidden=true};
  $('#pwshow').onchange=e=>{['pw1','pw2'].forEach(i=>$('#'+i).type=e.target.checked?'text':'password')};
  const bad=m=>{$('#pwerr').textContent=m;$('#pwerr').hidden=false};
  $('#pwok').onclick=async()=>{const a=$('#pw1').value,b=$('#pw2').value;$('#pwerr').hidden=true;
    if(a.length<6)return bad('รหัสผ่านต้องมีอย่างน้อย 6 ตัว');if(a!==b)return bad('รหัสผ่านทั้งสองช่องไม่ตรงกัน');
    const k=$('#pwok');k.disabled=true;k.textContent='กำลังบันทึก...';
    try{await DB.changePw(a);$('#dlg').hidden=true;toast('เปลี่ยนรหัสผ่านเรียบร้อย ครั้งหน้าใช้รหัสใหม่')}catch(err){bad(err.message)}finally{k.disabled=false;k.textContent='บันทึกรหัสใหม่'}}});
</script>
